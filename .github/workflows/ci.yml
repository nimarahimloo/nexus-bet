name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Cypress is a local e2e tool; do not download a browser in CI.
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Reject committed conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- server client shared docs drizzle api todo.md README.md; then
            echo "::error::Merge conflict markers are committed. Resolve them before pushing."
            exit 1
          fi

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
